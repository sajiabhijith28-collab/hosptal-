const r={id:'rec-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),type:$('#r-type').value,title:$('#r-title').value.trim(),date:$('#r-date').value,doctor:$('#r-doctor').value.trim(),hospital:$('#r-hospital').value.trim(),medicines:$('#r-medicines').value.trim(),notes:$('#r-notes').value.trim(),fileName:file?file.name:'',fileData,created:Date.now()};
if(!r.title){err.textContent='Please add a record title.';return}
const all=ls.g('mw_records',{});all[U.id]=[...(all[U.id]||[]),r];
try{ls.s('mw_records',all);e.target.reset();render(1)}catch(_){err.textContent='Storage is full. Try a smaller file or remove older records.'}
});
ready.then(()=>{const u=USERS.find(u=>u.id===ls.g('mw_sess',null));u?enter(u):go('login')});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

/* Splash screen: reveal the app after a short branded intro. */
(()=>{
 const splash=document.getElementById('mw-splash');
 if(!splash)return;
 const dismiss=()=>{splash.classList.add('mw-splash-hide');setTimeout(()=>splash.remove(),750)};
 const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 window.addEventListener('load',()=>setTimeout(dismiss,reduced?250:1800),{once:true});
 setTimeout(dismiss,3500);
})();

/* Desktop / Mobile Phone View Mode Switcher */
(()=>{
  if(window.innerWidth<=768&&'ontouchstart' in window)return;
  const bar=document.createElement('div');
  bar.className='mw-mode-toggle';
  bar.innerHTML='<button id="mw-btn-mob" class="mw-mode-btn on" type="button">📱 Mobile Phone</button><button id="mw-btn-desk" class="mw-mode-btn" type="button">💻 Full Desktop</button>';
  document.body.appendChild(bar);
  document.body.classList.add('mw-phone-mode');
  const bMob=document.getElementById('mw-btn-mob');
  const bDesk=document.getElementById('mw-btn-desk');
  bMob.onclick=()=>{document.body.classList.add('mw-phone-mode');bMob.classList.add('on');bDesk.classList.remove('on')};
  bDesk.onclick=()=>{document.body.classList.remove('mw-phone-mode');bDesk.classList.add('on');bMob.classList.remove('on')};
})();

</script>
</body>
